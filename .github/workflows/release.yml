name: Build and Release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Read app version from go.mod
        id: version
        shell: pwsh
        run: |
          $line = Select-String -Path go.mod -Pattern '^// Version:\s+(\S+)' | Select-Object -First 1
          if (-not $line) { throw "Could not read '// Version: x.y.z' from go.mod" }
          $ver = $line.Matches[0].Groups[1].Value
          Write-Host "APP_VERSION=$ver"
          "version=$ver" >> $env:GITHUB_OUTPUT
          "tag=v$ver" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc after Chocolatey install"
          }
          Write-Host "ISCC=$iscc"

      - name: Build binaries and installer
        shell: cmd
        run: build.bat

      - name: Verify build outputs
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $files = @(
            "dist\cursor-tray-setup-x86_64-$ver.exe",
            "dist\cursor-tray-x86_64-$ver.exe",
            "dist\cursor-tray-arm64-$ver.exe"
          )
          foreach ($f in $files) {
            if (-not (Test-Path $f)) {
              Get-ChildItem dist -ErrorAction SilentlyContinue | Format-Table Name, Length
              throw "Expected build output missing: $f"
            }
            Get-Item $f | Format-List FullName, Length, LastWriteTime
          }

      # No Actions artifacts — upload installer + portable binaries to the Release only.
      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/cursor-tray-setup-x86_64-${{ steps.version.outputs.version }}.exe
            dist/cursor-tray-x86_64-${{ steps.version.outputs.version }}.exe
            dist/cursor-tray-arm64-${{ steps.version.outputs.version }}.exe
