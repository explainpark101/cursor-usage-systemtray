[package]
name = "cursor-api"
version = "0.1.0"
edition = "2021"
description = "Unofficial Rust client for Cursor dashboard usage / billing APIs"
license = "MIT"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# HTTP uses the system `curl` binary by default so the crate builds without a
# C toolchain / rustls ring asm on windows-gnu hosts.

[[example]]
name = "fetch"
path = "examples/fetch.rs"
